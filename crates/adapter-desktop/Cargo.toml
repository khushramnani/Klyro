[package]
name = "klyro-adapter-desktop"
description = "Klyro adapter for native desktop apps (Windows UI Automation)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
klyro-core.workspace = true

[target.'cfg(windows)'.dependencies]
uiautomation = { version = "0.25", features = ["screenshot"] }
png = "0.18"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
